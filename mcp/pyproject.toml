[project]
name = "milaclone-mcp"
version = "0.1.0"
description = "MCP server for a self-hosted milaclone board (full read/write + search)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "mcp>=2.0,<3",
    "uvicorn>=0.30",
]

[project.scripts]
milaclone-mcp = "milaclone_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["milaclone_mcp"]

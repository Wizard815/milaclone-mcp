name: milaclone-mcp

services:
  app:
    build: ./app
    image: milaclone-app:local
    container_name: milaclone-app
    restart: unless-stopped
    # LAN access via the Unraid host IP.
    ports:
      - "4321:4321"
    volumes:
      # Bind mounts under Unraid's appdata by default — visible in the array,
      # covered by the CA Backup plugin. Override DATA_PATH/UPLOADS_PATH in
      # .env to put them somewhere else.
      - ${DATA_PATH:-/mnt/user/appdata/milaclone-mcp/data}:/data
      - ${UPLOADS_PATH:-/mnt/user/appdata/milaclone-mcp/uploads}:/app/public/uploads
    environment:
      - PORT=4321
      - DATA_DIR=/data
      # Shared secret protecting /api/*. The mcp service below picks the
      # same value up automatically. Leave unset to run the API open (fine
      # on a trusted LAN + tunnel setup).
      - API_KEY=${API_KEY:-}
      # Miladash "Promote to a project": where Pondering Orb is, and an Orb
      # API token (one of Orb's ORB_API_TOKENS). Server-side only.
      - ORB_URL=${ORB_URL:-}
      - ORB_TOKEN=${ORB_TOKEN:-}
      # Bearer token for the task API (/api/tasks; docs: app/docs/task-api.md),
      # used by the voice add-on and the MCP's add_task/list_tasks. Unset = off.
      - TASK_API_TOKEN=${TASK_API_TOKEN:-}
      - TASK_TZ=${TASK_TZ:-UTC}
    networks:
      - edge
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  mcp:
    build: ./mcp
    image: milaclone-mcp:local
    container_name: milaclone-mcp
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8383:8383"
    environment:
      # Always co-located with `app` on the `edge` network, so no need to
      # make this user-configurable.
      - MILACLONE_URL=http://milaclone-app:4321
      - MILACLONE_API_KEY=${API_KEY:-}
      # Protects THIS server's own /mcp endpoint (streamable-http). Separate
      # concern from API_KEY above — see mcp/README.md.
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      # Same value as the app's, enables the MCP's add_task / list_tasks.
      - TASK_API_TOKEN=${TASK_API_TOKEN:-}
      # The name the board's activity log gives MCP changes when a tool isn't told one.
      - MILACLONE_AGENT=${MILACLONE_AGENT:-}
    networks:
      # `edge` for tunnel reachability (same as `app`); `ai` in addition, so
      # AI tooling can reach this service directly without going through the
      # tunnel. `app` deliberately does NOT join `ai`.
      - edge
      - ai
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ---- Optional voice capture add-on (app/addons/voice/README.md) ------------
  # Off unless COMPOSE_PROFILES=voice in .env. Sends audio to Deepgram and the
  # transcript to an LLM, then creates tasks through the app's task API over
  # the edge network. The Alexa/Cloudflare part is in app/docker-compose.yml.
  pipeline:
    build: ./app/addons/voice/pipeline
    image: milaclone-pipeline:local
    container_name: milaclone-pipeline
    profiles: ["voice"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8183:8000"
    volumes:
      - milaclone_ingest:/data
    environment:
      - INGEST_API_TOKEN=${INGEST_API_TOKEN:-}
      - TASK_API_TOKEN=${TASK_API_TOKEN:-}
      - APP_URL=http://milaclone-app:4321
      - TASK_TZ=${TASK_TZ:-UTC}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - DEEPGRAM_MODEL=${DEEPGRAM_MODEL:-nova-3}
      - DEEPGRAM_LANGUAGE=${DEEPGRAM_LANGUAGE:-en}
      - DEEPGRAM_MIP_OPT_OUT=${DEEPGRAM_MIP_OPT_OUT:-true}
      - DEEPGRAM_KEYTERMS=${DEEPGRAM_KEYTERMS:-}
      - TRANSCRIBE_RETRY_DELAYS=${TRANSCRIBE_RETRY_DELAYS:-60,300,900}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - INGEST_REVIEW_URL=${INGEST_REVIEW_URL:-}
      - EXTRACT_PROVIDER=${EXTRACT_PROVIDER:-anthropic}
      - EXTRACT_MODEL=${EXTRACT_MODEL:-}
      - EXTRACT_API_KEY=${EXTRACT_API_KEY:-}
      - EXTRACT_BASE_URL=${EXTRACT_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
    networks:
      - edge
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

volumes:
  milaclone_ingest:

networks:
  # Existing Cloudflare Tunnel (cloudflared) network — lets it reach either
  # service by container name for remote access. Create once if it doesn't
  # exist: `docker network create ${NETWORK_NAME:-proxynat}`. Override
  # NETWORK_NAME in .env if your tunnel setup uses a different network name.
  edge:
    external: true
    name: ${NETWORK_NAME:-proxynat}
  # Network your AI tooling lives on, so it can reach `mcp` directly.
  # Override AI_NETWORK_NAME in .env if yours is named differently.
  ai:
    external: true
    name: ${AI_NETWORK_NAME:-ai_net}
